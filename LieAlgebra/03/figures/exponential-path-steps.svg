<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="100mm" viewBox="0 0 240 100"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#326c91" stroke-width="1"/></marker></defs>

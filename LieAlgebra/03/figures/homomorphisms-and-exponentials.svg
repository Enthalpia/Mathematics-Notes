<text x="52" y="33" text-anchor="middle" style="font-family:serif;font-size:3.5px">$X\in\mathfrak g$</text>
<text x="187" y="33" text-anchor="middle" style="font-family:serif;font-size:3.5px">$\phi(X)\in\mathfrak h$</text>
